  <head>
    <meta charset="UTF-8" />

    <title>Contact Me | My Portfolio</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!-- Shared Header -->
    <header class="site-header">
      <div class="container">
        <p class="site-title">
          <a href="index.html">My Portfolio</a>
        </p>

        <h1>Contact Me</h1>
        <p>I would love to connect with you.</p>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="container">
        <h2>Send Me a Message</h2>

        <form action="#" method="post">
          <label for="name">Your Name:</label><br />
          <input type="text" id="name" name="name" required />
          <br /><br />

          <label for="email">Your Email:</label><br />
          <input type="email" id="email" name="email" required />
          <br /><br />

          <label for="subject">Subject:</label><br />
          <input type="text" id="subject" name="subject" required />
          <br /><br />

          <label for="message">Your Message:</label><br />
          <textarea
            id="message"
            name="message"
            rows="5"
            required
          ></textarea>
          <br /><br />

          <button type="submit">Send Message</button>
        </form>

        <h2>Email</h2>
        <p>
          <a href="mailto:kipsbett05@gmail.com">
            kipsbett05@gmail.com
          </a>
        </p>

        <h2>Social Links</h2>

          <li>
            <a href="https://github.com/Bett-Kips">My GitHub</a>
          </li>
          <li>
            <a href="https://www.linkedin.com/">LinkedIn</a>
          </li>
        </ul>
      </div>
    </main>
