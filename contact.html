<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Contact Bett Kips to connect about software engineering, web development, and projects."
    />

    <title>Contact Me | Bett's Portfolio</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Shared Header -->
    <header class="site-header">
      <div class="container">
        <p class="site-title">
          <a href="index.html">My Portfolio</a>
        </p>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="container">
        <section>
          <h1>Contact Me</h1>
          <p>I would love to connect with you.</p>
        </section>

        <!-- Contact Form -->
        <section>
          <h2>Send Me a Message</h2>

          <form class="contact-form" action="#" method="post">
            <div>
              <label for="name">Your Name:</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
              />
            </div>

            <div>
              <label for="email">Your Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>

            <div>
              <label for="subject">Subject:</label>
              <input type="text" id="subject" name="subject" required />
            </div>

            <div>
              <label for="message">Your Message:</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
            </div>

            <button class="button" type="submit">Send Message</button>
          </form>
        </section>

        <!-- Email Contact -->
        <section>
          <h2>Email</h2>
          <p>
            <a href="mailto:kipsbett05@gmail.com"> kipsbett05@gmail.com </a>
          </p>
        </section>

        <!-- Social Links -->
        <section>
          <h2>Social Links</h2>
          <ul>
            <li>
              <a href="https://github.com/Bett-Kips">My GitHub</a>
            </li>
            <li>
              <a href="https://www.linkedin.com/">LinkedIn</a>
            </li>
          </ul>
        </section>
      </div>
    </main>

    <!-- Shared Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Bett Kips. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
